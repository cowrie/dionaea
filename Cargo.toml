# ABOUTME: Workspace root for the Dionaea v2 Rust core.
# ABOUTME: Defines shared dependencies, lints, and crate membership.

[workspace]
resolver = "2"
members = [
    "crates/dionaea",
    "crates/ipstack",
    "crates/shell-detect",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only OR LicenseRef-Cowrie-Commercial"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# TLS (must use openssl for weak cipher honeypot support)
openssl = "0.10"
tokio-openssl = "0.6"

# Version from git describe
git-version = "0.3"

# Python embedding
pyo3 = { version = "0.28", features = ["auto-initialize"] }
pyo3-stub-gen = { version = "0.19", default-features = false }

# Logging + observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Metrics (facade pattern — plug in any exporter)
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Timestamps
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Config
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Data structures
bytes = "1"
dashmap = "6"

# Crypto
sha2 = "0.10"

# DNS
hickory-resolver = { version = "0.25", features = ["tokio"] }

# IP deny list (CIDR prefix matching)
ip_network = "0.4"
ip_network_table = "0.2"

# HTTP client (replaces curl module)
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "multipart"] }

# System/privileges
nix = { version = "0.30", features = ["socket", "uio", "user", "process", "fs", "net", "resource", "signal"] }

# Platform-specific (Linux only, behind cfg)
pcap = "2"
nfq = "0.2"
rtnetlink = "0.15"

# Packet parsing and construction
etherparse = "0.16"

# Random number generation
rand = "0.9"

# TUN device (async Tokio support)
tun-rs = { version = "2.8", features = ["async"] }

# Testing
proptest = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
