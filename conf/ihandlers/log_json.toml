name = "log_json"

[config]
# Each entry is a file path or HTTP(S) URL.
# File paths are relative to the working directory.
# Examples:
#   "var/dionaea/incidents.jsonl"     — local file (append mode)
#   "https://log.example.com/ingest" — POST JSON to remote endpoint
handlers = ["var/log/dionaea/incidents.jsonl"]
