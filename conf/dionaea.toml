# ABOUTME: Default configuration for the dionaea honeypot daemon.
# ABOUTME: See RUSTPLAN.md for config key documentation.

[dionaea]

[dionaea.listen]
mode = "manual"
addresses = ["0.0.0.0"]

[dionaea.limits]
max_fds_pct = 70
max_connections_total = 10000
max_connections_per_ip = 50
send_channel_capacity = 256
recv_buffer_size = 65536

[dionaea.admin]
listen = "127.0.0.1"

[logging]

[[logging.targets]]
type = "stdout"
format = "text"
levels = "info,warning,error,critical"
domains = "*"

[[logging.targets]]
type = "file"
path = "var/log/dionaea/dionaea.jsonl"
format = "json"
levels = "info,warning,error,critical"
domains = "*"

[[logging.targets]]
type = "file"
path = "var/log/dionaea/error.log"
format = "text"
levels = "warning,error,critical"
domains = "*"

[modules]
download = true
nfq = false
netlink = false

[modules.pcap]

[modules.python]
python_path = "modules/python"
imports = ["dionaea", "dionaea.log", "dionaea.ihandlers", "dionaea.services"]
service_configs = ["conf/services/*.toml"]
ihandler_configs = [
    "conf/ihandlers/store.toml",
    "conf/ihandlers/log_json.toml",
    "conf/ihandlers/log_sqlite.toml",
    "conf/ihandlers/speakeasy.toml",
    "conf/ihandlers/virustotal.toml",
]

# Processor pipeline: filter → streamdumper, filter → shellcode detection
[[processors]]
name = "filter"
label = "filter_streamdumper"
next = ["streamdumper"]
deny = [
    { protocols = ["ftpdata", "ftpdatacon"] },
]

[[processors]]
name = "streamdumper"
label = "streamdumper"
path = "var/dionaea/bistreams/%Y-%m-%d/"

[[processors]]
name = "filter"
label = "filter_shellcode"
next = ["shellcode"]
allow = [
    { protocols = ["smbd", "epmapper", "mssqld", "httpd"] },
]

[[processors]]
name = "shellcode"
label = "shellcode"
