name = "rdp"

[config]
port = 3389

# DOUBLEPULSAR ping response OS fingerprint
# Default: Windows 7 SP1 x64 (common DOUBLEPULSAR target)
[config.os_version]
major = 6
minor = 1
build = 7601
service_pack = 1
# Product type: 1 = VER_NT_WORKSTATION, 2 = VER_NT_DOMAIN_CONTROLLER, 3 = VER_NT_SERVER
product_type = 1
# Architecture: 32 or 64
arch = 64
