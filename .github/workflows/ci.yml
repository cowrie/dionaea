# ABOUTME: CI workflow for the Rust + Python dionaea honeypot.
# ABOUTME: Runs formatting, linting, tests, build, Python lint, and Sphinx docs.
# ABOUTME: Tests against multiple Python versions including free-threaded builds.
---
# SPDX-FileCopyrightText: none
# SPDX-License-Identifier: CC0-1.0
name: CI

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Format & Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl-dev \
            pkg-config \
            python3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-features -- -D warnings

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        free-threaded: [false]
        include:
          - python-version: '3.13t'
            free-threaded: true
          - python-version: '3.14t'
            free-threaded: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Separate cache per Python version since PyO3 links against specific libpython
          key: py-${{ matrix.python-version }}

      - name: Configure PyO3 Python
        run: |
          PYTHON_PATH=$(python -c "import sys; print(sys.executable)")
          echo "PYO3_PYTHON=$PYTHON_PATH" >> "$GITHUB_ENV"
          python -c "import sys; print(f'Python {sys.version}')"
          python -c "
          import sys
          if hasattr(sys, '_is_gil_enabled'):
              print(f'GIL enabled: {sys._is_gil_enabled()}')
          else:
              print('GIL enabled: true (pre-3.13)')
          "

      - name: Run tests
        run: cargo test --features download,upload,tls

  build:
    name: Release build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl-dev \
            pkg-config \
            python3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

  integration:
    name: Integration (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
        free-threaded: [false]
        include:
          - python-version: '3.13t'
            free-threaded: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: py-${{ matrix.python-version }}

      - name: Configure PyO3 Python
        run: |
          PYTHON_PATH=$(python -c "import sys; print(sys.executable)")
          echo "PYO3_PYTHON=$PYTHON_PATH" >> "$GITHUB_ENV"
          python -c "import sys; print(f'Python {sys.version}')"

      - name: Build and install
        run: |
          cargo build --release
          sudo mkdir -p /opt/dionaea/{bin,conf,modules/python,var/dionaea/{bistreams,downloads,shellcode},var/log/dionaea}
          sudo cp target/release/dionaea /opt/dionaea/bin/
          sudo cp -r conf/* /opt/dionaea/conf/
          sudo cp -r modules/python/dionaea /opt/dionaea/modules/python/

      - name: Start dionaea
        run: |
          sudo /opt/dionaea/bin/dionaea -c /opt/dionaea/conf/dionaea.toml &
          sleep 3
          # Verify it's running and HTTP is responding
          timeout 30 bash -c "until curl -sf http://localhost/ > /dev/null 2>&1; do sleep 1; done"

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run protocol smoke tests
        run: cd tests && pytest shellcode/ ftp/ http/tests/test_http_smoke.py -v --timeout=30

      - name: Show logs on failure
        if: failure()
        run: cat /opt/dionaea/var/log/dionaea/*.log 2>/dev/null || true

  spdx-check:
    name: SPDX License Headers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check SPDX headers
        run: python3 scripts/check-spdx.py .

  python-lint:
    name: Lint - Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install linters
        run: pip install ruff mypy

      - name: Run ruff
        run: ruff check modules/

      - name: Run mypy
        run: |
          mypy --no-strict-optional --ignore-missing-imports --allow-untyped-globals \
              --disable-error-code=import-untyped \
              --exclude 'modules/python/dionaea/(submit_http|hpfeeds|virustotal|s3)\.py' \
              --exclude 'modules/python/dionaea/(mqtt|pptp|sip|memcache|mongo)/' \
              --exclude 'modules/python/dionaea/tftp\.py' \
              --exclude 'modules/python/util/(csv2sqlite|xmpp/pg_backend)\.py' \
              modules/

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Sphinx
        run: pip install sphinx doc8

      - name: Build HTML documentation
        run: |
          cd doc/source
          sphinx-build -W -b html . ../_build/html

      - name: Build LaTeX documentation
        run: |
          cd doc/source
          sphinx-build -W -b latex . ../_build/latex

      - name: Check documentation style
        run: |
          doc8 --verbose --allow-long-titles --max-line-length=9999 \
            CHANGELOG.rst CONTRIBUTING.rst doc/source
