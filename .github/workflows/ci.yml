# ABOUTME: CI workflow for the Rust + Python dionaea honeypot.
# ABOUTME: Runs formatting, linting, tests, build, Python lint, and Sphinx docs.
---
# SPDX-FileCopyrightText: none
# SPDX-License-Identifier: CC0-1.0
name: CI

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Format & Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl-dev \
            pkg-config \
            python3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl-dev \
            pkg-config \
            python3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --features download,upload,tls

  build:
    name: Release build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl-dev \
            pkg-config \
            python3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

  python-lint:
    name: Lint - Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linters
        run: pip install ruff mypy

      - name: Run ruff
        run: ruff check modules/

      - name: Run mypy
        run: |
          mypy --no-strict-optional --ignore-missing-imports --allow-untyped-globals \
              --disable-error-code=import-untyped \
              --exclude 'modules/python/dionaea/(submit_http|hpfeeds|virustotal|s3)\.py' \
              --exclude 'modules/python/dionaea/(mqtt|pptp|sip|memcache|mongo)/' \
              --exclude 'modules/python/dionaea/tftp\.py' \
              --exclude 'modules/python/util/(csv2sqlite|xmpp/pg_backend)\.py' \
              modules/

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Sphinx
        run: pip install sphinx doc8

      - name: Build HTML documentation
        run: |
          cd doc/source
          sphinx-build -W -b html . ../_build/html

      - name: Build LaTeX documentation
        run: |
          cd doc/source
          sphinx-build -W -b latex . ../_build/latex

      - name: Check documentation style
        run: |
          doc8 --verbose --allow-long-titles --max-line-length=9999 \
            CHANGELOG.rst CONTRIBUTING.rst doc/source
