# ABOUTME: Main dionaea crate - honeypot binary with PyO3 Python bridge.
# ABOUTME: Contains networking, incident system, and protocol handler integration.

[package]
name = "dionaea"
version = "2.0.0-alpha.1"
default-run = "dionaea"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
pyo3 = { workspace = true }
git-version = { workspace = true }
pyo3-stub-gen = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
tracing-appender = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true, optional = true }
serde = { workspace = true }
toml = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
nix = { workspace = true }

shell-detect = { path = "../shell-detect" }
sha2 = { workspace = true }

# Optional dependencies (behind features)
openssl = { workspace = true, optional = true }
tokio-openssl = { workspace = true, optional = true }
hickory-resolver = { workspace = true, optional = true }
ip_network = { workspace = true, optional = true }
ip_network_table = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
pcap = { workspace = true, optional = true }
nfq = { workspace = true, optional = true }
rtnetlink = { workspace = true, optional = true }
dionaea-ipstack = { path = "../ipstack", optional = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = "1"
tempfile = "3"

[features]
default = ["tls", "dns", "download", "upload", "deny-list", "pcap"]
prometheus = ["dep:metrics-exporter-prometheus"]
ipstack = ["dep:dionaea-ipstack"]
tls = ["dep:openssl", "dep:tokio-openssl"]
dns = ["dep:hickory-resolver"]
download = ["dep:reqwest"]
upload = ["dep:reqwest"]
deny-list = ["dep:ip_network", "dep:ip_network_table"]
pcap = ["dep:pcap"]
nfq = ["dep:nfq"]
netlink = ["dep:rtnetlink"]
mgmt-https = ["dep:reqwest"]
mgmt-dns = []

[lints]
workspace = true
